<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>{{ page.title }} - UW Database Group</title>
  <meta name="viewport" content="width=device-width">

  <!-- syntax highlighting CSS -->
  <link rel="stylesheet" href="{{ site.baseurl}}/css/syntax.css">

  <!-- Custom CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="{{ site.baseurl}}/css/main.css">

  <link rel="shortcut icon" href="{{ site.baseurl}}/favicon.ico" />

  <script>
    (function (i, s, o, g, r, a, m) {
      i['GoogleAnalyticsObject'] = r; i[r] = i[r] || function () {
        (i[r].q = i[r].q || []).push(arguments)
      }, i[r].l = 1 * new Date(); a = s.createElement(o),
        m = s.getElementsByTagName(o)[0]; a.async = 1; a.src = g; m.parentNode.insertBefore(a, m)
    })(window, document, 'script', 'https://www.google-analytics.com/analytics.js', 'ga');

    ga('create', 'UA-97912980-1', 'auto');
    ga('send', 'pageview');
  </script>
</head>

<body>
  <!-- Skip to main content link for keyboard navigation -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Fixed navbar -->
  <nav class="navbar navbar-expand-md navbar-light bg-light" aria-label="Main navigation">
    <div class="container flex-wrap">
      <a class="navbar-brand" href="{{ site.baseurl}}/">
        <img src="{{ site.baseurl}}/images/uwdb-logo.svg" alt="University of Washington Database Group Logo"
          class="logo">
      </a>
      <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand me-auto" href="https://www.cs.washington.edu">
        <img src="{{ site.baseurl}}/images/allen-school-logo.svg"
          alt="Paul G. Allen School of Computer Science and Engineering Logo" class="logo">
      </a>
      <div class="collapse navbar-collapse mt-2" id="navbarNav">
        <ul class="navbar-nav gap-3">
          {% include pages_list %}
        </ul>
      </div>
    </div>
  </nav>

  <main id="main-content" role="main">
    {{ content }}
  </main>

  <footer id="footer" role="contentinfo">
    <div class="container">
      <p class="text-muted credit">
        <a href="http://www.washington.edu/">University of Washington</a> Database Group, <abbr
          title="last build date {{site.time | date: '%B %d %Y'}}">{{ site.time | date: '%Y'}}</abbr>
        <a href="https://github.com/uwdb/website/blob/gh-pages/{{page.path}}" class="float-end">Edit this page</a>
        <a href="{{ site.baseurl }}/internals.html"><i class="fa fa-cog"></i> Internals</a>
      </p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function () {
      var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });
    });
  </script>
</body>

</html>
