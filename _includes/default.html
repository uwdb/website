<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>{{ page.title }} - UW Database Group</title>
  <meta name="viewport" content="width=device-width">

  <!-- syntax highlighting CSS -->
  <link rel="stylesheet" href="{{ site.baseurl}}/css/syntax.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="//netdna.bootstrapcdn.com/bootstrap/3.3.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="{{ site.baseurl}}/css/main.css">

  <link rel="shortcut icon" href="{{ site.baseurl}}/favicon.ico" />

  <script>
    (function (i, s, o, g, r, a, m) {
      i['GoogleAnalyticsObject'] = r; i[r] = i[r] || function () {
        (i[r].q = i[r].q || []).push(arguments)
      }, i[r].l = 1 * new Date(); a = s.createElement(o),
        m = s.getElementsByTagName(o)[0]; a.async = 1; a.src = g; m.parentNode.insertBefore(a, m)
    })(window, document, 'script', 'https://www.google-analytics.com/analytics.js', 'ga');

    ga('create', 'UA-97912980-1', 'auto');
    ga('send', 'pageview');
  </script>
</head>

<body>
  <!-- Skip to main content link for keyboard navigation -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Fixed navbar -->
  <nav class="navbar navbar-default navbar-static-top" role="navigation" aria-label="Main navigation">
    <div class="container">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="{{ site.baseurl}}/">
          <img src="{{ site.baseurl}}/images/uwdb-logo.svg" alt="University of Washington Database Group Logo"
            class="logo"></img>
        </a>
        <a class="navbar-brand" href="https://www.cs.washington.edu">
          <img src="{{ site.baseurl}}/images/allen-school-logo.svg"
            alt="Paul G. Allen School of Computer Science and Engineering Logo" class="logo"></img>
        </a>
      </div>
      <div class="navbar-collapse collapse">
        <ul class="nav navbar-nav">
          {% include pages_list %}
        </ul>
      </div><!--/.nav-collapse -->
    </div>
  </nav>

  <main id="main-content" role="main">
    {{ content }}
  </main>

  <footer id="footer" role="contentinfo">
    <div class="container">
      <p class="text-muted credit">
        <a href="http://www.washington.edu/">University of Washington</a> Database Group, <abbr
          title="last build date {{site.time | date: '%B %d %Y'}}">{{ site.time | date: '%Y'}}</abbr>
        <a href="https://github.com/uwdb/website/blob/gh-pages/{{page.path}}" class="pull-right">Edit this page</a>
        <a href="{{ site.baseurl }}/internals.html"><i class="fa fa-cog"></i> Internals</a>
      </p>
    </div>
  </footer>
  <script src="https://code.jquery.com/jquery-2.1.0.min.js"></script>
  <script src="//netdna.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
  <script type="text/javascript">
    $(function () {
      $('[data-toggle="tooltip"]').tooltip();
    })
  </script>
</body>

</html>
