- date: 2025-07-01
  description: >
    'CENTS: A Flexible and Cost-Effective Framework for LLM-Based Table Understanding' by Guorui Xiao, Dong He, Jin Wang, and Magdalena Balazinska has been accepted at VLDB 2025.

- date: 2025-06-25
  description: >
    '[LpBound: Pessimistic Cardinality Estimation using ℓp-Norms of Degree Sequences](https://arxiv.org/abs/2502.05912)' by Haozhe Zhang, Christoph Mayer, Mahmoud Abo Khamis, Dan Olteanu, Dan Suciu received the SIGMOD'2025 Best Paper Award.

- date: 2025-05-08
  description: >
    '[Bootstrapping Compositional Video Query Synthesis with Natural Language and Previous Queries from Users](https://db.cs.washington.edu/projects/visualworld/poly-vocal.pdf)' by Manasi Ganti, Enhao Zhang, and Magdalena Balazinska has been accepted at the HILDA workshop, SIGMOD 2025.

- date: 2025-03-26
  description: >
    '[MaskSearch: Querying Image Masks at Scale](https://dongheuw.github.io/files/masksearch-icde2025.pdf)' by [Dong He](https://dongheuw.github.io/), Jieyu Zhang, Maureen Daum, Alexander Ratner, and Magdalena Balazinska has been accepted at ICDE 2025.

- date: 2025-03-03
  description: >
    Kyle Deeds and Timo Camillo Merkle received the Best Paper award at ICDT 2025 for their paper [Worst-Case Optimal Joins Meet Partition Constraints](https://arxiv.org/abs/2501.04190)!

- date: 2025-02-14
  description: >
    ['Mind the Data Gap: Bridging Large Language Models (LLMs) to Enterprise Data Integration'](https://vldb.org/cidrdb/papers/2025/p34-kayali.pdf) by Moe Kayali (University of Washington), Fabian Wenz (TUM), Nesime Tatbul (Intel Labs and MIT), Cagatay Demiralp (MIT CSAIL) has been accepted at CIDR 2025.

- date: 2025-02-12
  description: |
    Four papers from UWDB got accepted into SIGMOD 2025!
    - ['Galley: Modern Query Optimization for Sparse Tensor Programming'](https://arxiv.org/abs/2408.14706) by Kyle Deeds, Willow Ahrens, Magda Balazinska and Dan Suciu
    - ['Self-Enhancing Video Data Management System for Compositional Events with Large Language Models'](https://arxiv.org/abs/2408.02243) by Enhao Zhang, Nicole Sullivan, Brandon Haynes, Ranjay Krishna, and Magdalena Balazinska
    - ['HoneyComb: A Parallel Worst-Case Optimal Join on Multicores'](https://arxiv.org/abs/2502.06715) by Jiacheng Wu and Dan Suciu
    - ['An Adaptive Benchmark for Modeling User Exploration of Large Datasets'](https://arxiv.org/abs/2203.15748), [ACM DL](https://dl.acm.org/doi/10.1145/3709658) by Joanna Purich, Anthony Wise and Leilani Battle

- date: 2024-12-10
  description: |
    Two papers from UWDB got accepted in ICDT 2025!
    - [Worst-Case Optimal Joins Meet Partition Constraints](https://arxiv.org/abs/2501.04190) by Kyle Deeds and Timo Camillo Merkle
    - [Semantic foundations of equality saturation](https://arxiv.org/abs/2501.02413) by Dan Suciu, Remy Wang and Yihong Zhang

- date: 2024-11-27
  description: >
    [Magda](https://www.cs.washington.edu/people/faculty/magda/) just received the Test-of-Time award at CIDR for her wonderful work on [Borealis](https://www.cidrdb.org/cidr2005/papers/P23.pdf) data stream processing system.

- date: 2024-05-27
  description: >
    '[Demonstration of MaskSearch: Efficiently Querying Image Masks for Machine Learning Workflows](https://arxiv.org/pdf/2404.06563)' by Lindsey Linxi Wei, Chung Yik Edward Yeung, Hongjian Yu, Jingchuan Zhou, Dong He, Magdalena Balazinska has been accepted at VLDB 2024.

- date: 2024-04-20
  description: >
    [Remy Wang](https://remy.wang/) received a runner up award for the 2024 Jim Gray SIGMOD Dissertation Award. Congratulations Remy!

- date: 2024-04-18
  description: >
    [Remy Wang](https://remy.wang/) published a research highlight paper called 'From Binary Join to Free Join' in [SIGMOD Record](https://sigmodrecord.org/sigmod-record-march-2024-vol-53-no-1/). There is a nice technical perspective by Thomas Neumann.

- date: 2024-04-04
  description: >
    [Nicole Sullivan](https://nicolesullivan.xyz) received a fellowship from the National Science Foundation Graduate Research Fellowship Program [(NSF GRFP)](https://www.nsfgrfp.org/).

- date: 2023-11-21
  description: >
    'Optimizing Dataflow Systems for Scalable Interactive Visualization' by Junran Yang, Hyekang Kevin Joo, Sai Yerramreddy, Dominik Moritz, and Leilani Battle to appear at SIGMOD 2024.

- date: 2023-08-18
  description: >
    '[VOCALExplore: Pay-as-You-Go Video Data Exploration and Model Building](https://www.vldb.org/pvldb/vol16/p4188-daum.pdf)' by Maureen Daum, Enhao Zhang, Dong He, Stephen Mussmann, Brandon Haynes, Ranjay Krishna, and Magdalena Balazinska to appear at VLDB 2024.

- date: 2023-06-16
  description: >
    '[EQUI-VOCAL: Synthesizing Queries for Compositional Video Events from Limited User Interactions](https://dl.acm.org/doi/abs/10.14778/3611479.3611482)' by Enhao Zhang, Maureen Daum, Dong He, Brandon Haynes, Ranjay Krishna, and Magdalena Balazinska has been accepted at VLDB 2023.

- date: 2023-01-27
  description: >
    '[Free Join: Unifying Worst-Case Optimal and Traditional Joins](https://arxiv.org/abs/2301.10841)' by Remy Wang, Max Willsey, and Dan Suciu to appear at SIGMOD 2023.

- date: 2022-11-25
  description: >
    '[Degree Sequence Bounds for Cardinality Estimation](https://arxiv.org/abs/2201.04166)' by Kyle Deeds, Dan Suciu, Magda Balazinska, and Walter Cai to appear at ICDT 2023; '[SafeBound: A Practical System for Generating Cardinality Bounds](https://arxiv.org/abs/2211.09864)' by Kyle Deeds, Dan Suciu, and Magda Balazinska to appear at SIGMOD 2023.

- date: 2022-11-15
  description: >
    'Optimizing Tensor Programs on Flexible Storage' by Maximilian Schleich, Amir Shaikhha, and Dan Suciu to appear at SIGMOD 2023.

- date: 2022-11-15
  description: >
    **Two** additional papers by the group to appear at VLDB 2023: 'Quasi-stable Coloring for Graph Compression' by Moe Kayali and Dan Suciu; 'Computing Rule-Based Explanations by Leveraging Counterfactuals' by Zixuan Geng, Maximilian Schleich, Dan Suciu.

- date: 2022-09-15
  description: >
    '[Understanding Programmatic Weak Supervision via Source-aware Influence Function](https://arxiv.org/abs/2205.12879)' has been accepted at NeurIPS 2022. Congrats [Jieyu Zhang](https://jieyuz2.github.io/), Cheng-Yu Hsieh, and Alex Ratner!

- date: 2022-09-06
  description: >
    '[Share the Tensor Tea: How Databases can Leverage the Machine Learning Ecosystem](https://www.vldb.org/pvldb/vol15/p3598-interlandi.pdf)' received the VLDB 2022 Best Demo Award. Congrats to the authors: Yuki Asada<sup>*</sup>, Victor Fu<sup>*</sup>, Apurva Gandhi<sup>*</sup>, Advitya Gemawat<sup>*</sup>, Lihao Zhang<sup>*</sup>, [Dong He](https://dongheuw.github.io/), Vivek Gupta, Ehi Nosakhare, Dalitso Banda, Rathijit Sen, and Matteo Interlandi!

- date: 2022-08-16
  description: >
    '[Nemo: Guiding and Contextualizing Weak Supervision for Interactive Data Programming](https://arxiv.org/abs/2203.01382)' has been accepted at VLDB 2023. Congrats Cheng-Yu Hsieh, [Jieyu Zhang](https://jieyuz2.github.io/), and Alex Ratner!

- date: 2022-04-11
  description: >
    [Dan Suciu](https://homes.cs.washington.edu/~suciu/) receives the [2022 SIGMOD Edgar F. Codd Innovations Award](https://sigmod.org/dan-suciu-2022-sigmod-edgar-f-codd-innovations-award/) for lasting contributions to the foundations of novel data management trends.

- date: 2022-04-08
  description: >
    [Leilani Battle](https://homes.cs.washington.edu/~leibatt/) is awarded the 2022 [IEEE TCDE Rising Star Award](http://tab.computer.org/tcde/tcdeawardsrecipients.html) for contributions to interactive data-intensive systems for exploratory data analysis.

- date: 2022-06-30
  description: >
    '[Query Processing on Tensor Computation Runtimes](https://dongheuw.github.io/files/tqp-vldb22.pdf)' has been accepted at VLDB 2022. Congrats to the authors: [Dong He](https://dongheuw.github.io/), Supun Nakandala, Dalitso Banda, Rathijit Sen, Karla Saur, Kwanghyun Park, Carlo Curino, Jesús Camacho-Rodríguez, Konstantinos Karanasos, and Matteo Interlandi!

- date: 2022-03-24
  description: >
    '[Convergence of Datalog over (Pre-) Semirings](https://arxiv.org/abs/2105.14435)' received a PODS 2022 best paper award. Congrats to the authors: Mahmoud Abo Khamis, [Hung Q. Ngo](http://hung-q-ngo.github.io), [Reinhard Pichler](https://www.dbai.tuwien.ac.at/staff/pichler/), [Dan Suciu](https://homes.cs.washington.edu/~suciu/), and [Remy Wang](https://remy.wang)!

- date: 2022-01-20
  description: >
    '[Creating Training Sets via Weak Indirect Supervision](https://arxiv.org/abs/2110.03484)' has been accepted at ICLR 2022. Congrats [Jieyu Zhang](https://jieyuz2.github.io/) and Alex Ratner!

- date: 2021-10-22
  description: >
    '[VOCAL: Video Organization and Interactive Compositional AnaLytics (Vision Paper)](https://db.cs.washington.edu/projects/visualworld/vocal-crc.pdf)' has been accepted at CIDR 2022. Congrats [Maureen Daum<sup>*</sup>](https://homes.cs.washington.edu/~mdaum/), [Enhao Zhang<sup>*</sup>](https://zhang-eh.github.io/), [Dong He](https://dongheuw.github.io/), Magdalena Balazinska, Brandon Haynes, Ranjay Krishna, Apryle Craig, Aaron Wirsing!
    <sup>*</sup>Both authors contributed equally to the paper.

- date: 2021-10-10
  description: >
    '[WRENCH: A Comprehensive Benchmark for Weak Supervision](https://openreview.net/forum?id=Q9SKS5k8io)' has been accepted at NeurIPS 2021 Dataset & Benchmark Track. Congrats [Jieyu Zhang](https://jieyuz2.github.io/) and Alex Ratner!

- date: 2021-08-15
  description: >
    '[DeepEverest: Accelerating Declarative Top-K Queries for Deep Neural Network Interpretation](http://vldb.org/pvldb/vol15/p98-he.pdf)' has been accepted at VLDB 2022. Congrats [Dong He](https://dongheuw.github.io/), [Maureen Daum](https://homes.cs.washington.edu/~mdaum/), [Walter Cai](https://waltercai.github.io/), Magdalena Balazinska!

- date: 2021-03-24
  description: >
    '[VSS: A Storage System for Video Analytics](https://db.cs.washington.edu/projects/visualworld/vss.pdf)' has been accepted to SIGMOD 2021. Congrats [Brandon Haynes](https://www.microsoft.com/en-us/research/people/brhaynes/), [Maureen Daum](https://homes.cs.washington.edu/~mdaum/), [Dong He](https://dongheuw.github.io/), [Amrita Mazumdar](https://homes.cs.washington.edu/~amrita), Magdalena Balazinska, Alvin Cheung, Luis Ceze!

- date: 2021-03-15
  description: >
    '[GeCo: Quality Counterfactual Explanations in Real Time](https://arxiv.org/abs/2101.01292)' has been accepted at VLDB 2021. Congrats [Maximilian Schleich](https://mjschleich.github.io/), Zixuan Geng, [Yihong Zhang](https://effect.systems), and [Dan Suciu](https://homes.cs.washington.edu/~suciu/)!

- date: 2021-02-12
  description: >
    '[TASM: A Tile-Based Storage Manager for Video Analytics](https://db.cs.washington.edu/projects/visualworld/tasm.pdf)' has been accepted to ICDE 2021. Congrats [Maureen Daum](https://homes.cs.washington.edu/~mdaum/), [Brandon Haynes](https://www.microsoft.com/en-us/research/people/brhaynes/), [Dong He](https://dongheuw.github.io/), [Amrita Mazumdar](https://homes.cs.washington.edu/~amrita), Magdalena Balazinska!

- date: 2021-02-04
  description: >
    [On the Tractability of SHAP explanations](https://arxiv.org/pdf/2009.08634.pdf) has been accepted to AAAI 2021, winning a Distinguished Paper award! Congrats to the authors: [Guy Van den Broeck](https://web.cs.ucla.edu/~guyvdb/) (UCLA), [Anton Lykov](https://antonlykov.com), [Maximilian Schleich](https://mjschleich.github.io/), and [Dan Suciu](https://homes.cs.washington.edu/~suciu/).

